services:
  - type: web
    name: pixel-frame-the-day
    runtime: node
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install --include=dev && npm run build
    startCommand: node server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@lnct.ac.in
      - key: ADMIN_PASSWORD
        value: Pixel#LNCT2026!Secure
      - key: STAFF_EMAIL
        value: staff@lnct.ac.in
      - key: STAFF_PASSWORD
        value: Staff#LNCT2026!Gate
